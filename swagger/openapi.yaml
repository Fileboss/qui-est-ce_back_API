---
openapi: 3.1.0
components:
  schemas:
    CardDTO:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        imageUrl:
          type: string
        packId:
          type: string
    CardUploadForm:
      type: object
      properties:
        name:
          type: string
        packId:
          type: string
        image:
          type: string
          format: binary
    GameDTO:
      type: object
      properties:
        gameId:
          type: string
        gameState:
          type: string
        cards:
          type: array
          items:
            $ref: "#/components/schemas/CardDTO"
    GameStatusResponse:
      type: object
      properties:
        status:
          type: string
        correct:
          type: boolean
    PackDTO:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    PackRequest:
      type: object
      required:
      - packName
      properties:
        packName:
          type: string
          pattern: \S
          maxLength: 128
    PageResponseCardDTO:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CardDTO"
        first:
          type: integer
          format: int32
        max:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
    PageResponseGameDTO:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GameDTO"
        first:
          type: integer
          format: int32
        max:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
    PageResponsePackDTO:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PackDTO"
        first:
          type: integer
          format: int32
        max:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
    PageResponseUserSummary:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
        first:
          type: integer
          format: int32
        max:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
    PasswordResetResponse:
      type: object
      properties:
        generatedPassword:
          type: string
    UserCreateRequest:
      type: object
      required:
      - username
      - role
      properties:
        username:
          type: string
          pattern: \S
          minLength: 3
          maxLength: 30
        role:
          type: string
          pattern: ^(player|admin)$
    UserCreateResponse:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        generatedPassword:
          type: string
    UserSummary:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        enabled:
          type: boolean
        createdTimestamp:
          type: integer
          format: int64
        roles:
          type: array
          items:
            type: string
  securitySchemes:
    SecurityScheme:
      type: openIdConnect
      description: Authentication
paths:
  /admin/users:
    get:
      parameters:
      - name: first
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: max
        in: query
        schema:
          type: integer
          format: int32
          maximum: 100
          minimum: 0
          default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseUserSummary"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: List Users
      tags:
      - Admin Resource
      security:
      - SecurityScheme:
        - admin
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCreateResponse"
        "400":
          description: Invalid request body
        "409":
          description: Username already exists
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Create User
      tags:
      - Admin Resource
      security:
      - SecurityScheme:
        - admin
  /admin/users/{id}:
    delete:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Delete User
      tags:
      - Admin Resource
      security:
      - SecurityScheme:
        - admin
  /admin/users/{id}/reset-password:
    post:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Reset Password
      tags:
      - Admin Resource
      security:
      - SecurityScheme:
        - admin
  /card/create:
    post:
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CardUploadForm"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Create Card
      tags:
      - Card Resource
      security:
      - SecurityScheme:
        - admin
  /card/{id}:
    delete:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Delete Card
      tags:
      - Card Resource
      security:
      - SecurityScheme:
        - admin
  /game:
    get:
      parameters:
      - name: first
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: max
        in: query
        schema:
          type: integer
          format: int32
          maximum: 100
          minimum: 0
          default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseGameDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Get All
      tags:
      - Game Resource
      security:
      - SecurityScheme: []
  /game/create:
    post:
      parameters:
      - name: packId
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Create Game
      tags:
      - Game Resource
      security:
      - SecurityScheme:
        - player
  /game/{gameId}:
    delete:
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Delete Game
      tags:
      - Game Resource
      security:
      - SecurityScheme:
        - player
  /game/{gameId}/guess:
    post:
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: string
      - name: cardId
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameStatusResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Guess
      tags:
      - Game Resource
      security:
      - SecurityScheme:
        - player
  /game/{gameId}/join:
    post:
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Join Game
      tags:
      - Game Resource
      security:
      - SecurityScheme:
        - player
  /game/{gameId}/reset:
    post:
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameStatusResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Reset Game
      tags:
      - Game Resource
      security:
      - SecurityScheme:
        - player
  /game/{gameId}/start:
    post:
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameStatusResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Start Game
      tags:
      - Game Resource
      security:
      - SecurityScheme:
        - player
  /pack:
    get:
      parameters:
      - name: first
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: max
        in: query
        schema:
          type: integer
          format: int32
          maximum: 100
          minimum: 0
          default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponsePackDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Get All
      tags:
      - Pack Resource
      security:
      - SecurityScheme: []
  /pack/create:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      summary: Create Pack
      tags:
      - Pack Resource
      security:
      - SecurityScheme:
        - admin
  /pack/{id}:
    patch:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Update Pack
      tags:
      - Pack Resource
      security:
      - SecurityScheme:
        - admin
    get:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Get One
      tags:
      - Pack Resource
      security:
      - SecurityScheme: []
    delete:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Delete Pack
      tags:
      - Pack Resource
      security:
      - SecurityScheme:
        - admin
  /pack/{id}/cards:
    get:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: first
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: max
        in: query
        schema:
          type: integer
          format: int32
          maximum: 100
          minimum: 0
          default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseCardDTO"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Get Cards By Pack
      tags:
      - Pack Resource
      security:
      - SecurityScheme: []
info:
